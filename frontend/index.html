
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>NEXUS Store — Premium E-Commerce</title>

    <meta name="description" content="NEXUS Store — Shop the latest premium products with seamless checkout, wishlist, and order tracking." />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />

    <link rel="stylesheet" href="css/style.css" />
</head>

<body>

    <!-- LOADER -->
    <div id="loader" class="loader">
        <div class="loader-ring"></div>
        <div class="loader-ring"></div>
        <div class="loader-ring"></div>
        <p class="loader-text">NEXUS</p>
    </div>

    <!-- TOAST CONTAINER -->
    <div id="toast-container" class="toast-container"></div>

    <!-- NAVBAR -->
    <nav class="navbar" id="navbar">

        <div class="nav-inner">

            <a href="#" class="nav-logo" id="nav-home-btn">
                <span class="logo-icon">⬡</span>
                <span class="logo-text">NEXUS</span>
            </a>

            <div class="nav-links">

                <a href="#" class="nav-link" id="link-shop" data-page="shop">
                    Shop
                </a>

                <a href="#" class="nav-link" id="link-featured" data-page="featured">
                    Featured
                </a>

                <a href="#" class="nav-link" id="link-orders" data-page="orders">
                    Orders
                </a>

            </div>

            <div class="nav-actions">

                <!-- SEARCH BUTTON -->
                <button class="nav-icon-btn" id="search-toggle-btn" title="Search">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="8" />
                        <path d="m21 21-4.35-4.35" />
                    </svg>
                </button>

                <!-- WISHLIST BUTTON -->
                <button class="nav-icon-btn" id="wishlist-btn" title="Wishlist">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z" />
                    </svg>
                    <span class="badge" id="wishlist-count">0</span>
                </button>

                <!-- CART BUTTON -->
                <button class="nav-icon-btn" id="cart-btn" title="Cart">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z" />
                        <line x1="3" y1="6" x2="21" y2="6" />
                        <path d="M16 10a4 4 0 0 1-8 0" />
                    </svg>
                    <span class="badge" id="cart-count">0</span>
                </button>

            </div>

            <!-- MOBILE MENU BUTTON -->
            <button class="mobile-menu-btn" id="mobile-menu-btn">
                <span></span>
                <span></span>
                <span></span>
            </button>

        </div>

        <!-- SEARCH BAR -->
        <div class="search-bar" id="search-bar">

            <div class="search-inner">

                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="11" cy="11" r="8" />
                    <path d="m21 21-4.35-4.35" />
                </svg>

                <input
                    type="text"
                    id="search-input"
                    placeholder="Search products, brands, categories..."
                    autocomplete="off"
                />

                <button id="search-close-btn">✕</button>

            </div>

            <div class="search-results" id="search-results"></div>

        </div>

    </nav>

    <!-- MOBILE SIDEBAR -->
    <div class="mobile-sidebar" id="mobile-sidebar">

        <div class="sidebar-inner">

            <button class="sidebar-close" id="sidebar-close">
                ✕
            </button>

            <a href="#" class="sidebar-link" data-page="shop">
                Shop
            </a>

            <a href="#" class="sidebar-link" data-page="featured">
                Featured
            </a>

            <a href="#" class="sidebar-link" data-page="orders">
                Orders
            </a>

        </div>

    </div>

    <div class="overlay" id="overlay"></div>

    <!-- MAIN APP -->
    <main id="app"></main>

    <!-- CART DRAWER -->
    <div class="cart-drawer" id="cart-drawer">

        <div class="drawer-header">
            <h3>Shopping Cart</h3>
            <button id="cart-close-btn">✕</button>
        </div>

        <div class="cart-items" id="cart-items">

            <div class="empty-state">
                <div class="empty-icon">🛒</div>
                <p>Your cart is empty</p>

                <button class="btn-primary" id="cart-shop-btn">
                    Start Shopping
                </button>
            </div>

        </div>

        <div class="cart-footer" id="cart-footer" style="display:none">

            <div class="cart-summary">

                <div class="summary-row">
                    <span>Subtotal</span>
                    <span id="cart-subtotal">₹0</span>
                </div>

                <div class="summary-row">
                    <span>Shipping</span>
                    <span id="cart-shipping">Free</span>
                </div>

                <div class="summary-row total">
                    <span>Total</span>
                    <span id="cart-total">₹0</span>
                </div>

            </div>

            <button class="btn-primary full" id="checkout-btn">
                Proceed to Checkout
            </button>

        </div>

    </div>

    <!-- MODALS -->
    <div class="modal-overlay" id="modal-overlay">

        <!-- PRODUCT DETAIL MODAL -->
        <div class="modal product-modal" id="product-modal">

            <button class="modal-close" id="product-modal-close">
                ✕
            </button>

            <div id="product-modal-content"></div>

        </div>

        <!-- CHECKOUT MODAL -->
        <div class="modal checkout-modal" id="checkout-modal">

            <button class="modal-close" id="checkout-modal-close">
                ✕
            </button>

            <h2 class="modal-title">Checkout</h2>

            <form id="checkout-form">

                <div class="checkout-grid">

                    <!-- SHIPPING ADDRESS -->
                    <div class="checkout-left">

                        <h4>Shipping Address</h4>

                        <div class="form-group">
                            <label>Street Address</label>
                            <input
                                type="text"
                                id="ship-street"
                                placeholder="123 Main Street"
                                required
                            />
                        </div>

                        <div class="form-row">

                            <div class="form-group">
                                <label>City</label>
                                <input
                                    type="text"
                                    id="ship-city"
                                    placeholder="Ahmedabad"
                                    required
                                />
                            </div>

                            <div class="form-group">
                                <label>State</label>
                                <input
                                    type="text"
                                    id="ship-state"
                                    placeholder="Gujarat"
                                    required
                                />
                            </div>

                        </div>

                        <div class="form-row">

                            <div class="form-group">
                                <label>ZIP Code</label>
                                <input
                                    type="text"
                                    id="ship-zip"
                                    placeholder="380001"
                                    required
                                />
                            </div>

                            <div class="form-group">
                                <label>Phone</label>
                                <input
                                    type="tel"
                                    id="ship-phone"
                                    placeholder="+91 9876543210"
                                    required
                                />
                            </div>

                        </div>

                        <!-- PAYMENT METHOD -->
                        <h4>Payment Method</h4>

                        <div class="payment-methods">

                            <label class="payment-option">
                                <input
                                    type="radio"
                                    name="payment"
                                    value="cod"
                                    checked
                                />
                                <span>Cash on Delivery</span>
                            </label>

                            <label class="payment-option">
                                <input
                                    type="radio"
                                    name="payment"
                                    value="upi"
                                />
                                <span>UPI</span>
                            </label>

                            <label class="payment-option">
                                <input
                                    type="radio"
                                    name="payment"
                                    value="card"
                                />
                                <span>Credit/Debit Card</span>
                            </label>

                        </div>

                    </div>

                    <!-- ORDER SUMMARY -->
                    <div class="checkout-right">

                        <h4>Order Summary</h4>

                        <div id="checkout-items"></div>

                        <div class="checkout-totals">

                            <div class="summary-row">
                                <span>Items</span>
                                <span id="co-items-price">₹0</span>
                            </div>

                            <div class="summary-row">
                                <span>Tax (18%)</span>
                                <span id="co-tax">₹0</span>
                            </div>

                            <div class="summary-row">
                                <span>Shipping</span>
                                <span id="co-shipping">Free</span>
                            </div>

                            <div class="summary-row total">
                                <span>Total</span>
                                <span id="co-total">₹0</span>
                            </div>

                        </div>

                        <button
                            type="submit"
                            class="btn-primary full"
                            id="place-order-btn"
                        >
                            Place Order
                        </button>

                    </div>

                </div>

            </form>

        </div>

    </div>

    <!-- JAVASCRIPT FILES -->
    <script src="js/api.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/ui.js"></script>

    <script src="js/pages/home.js"></script>
    <script src="js/pages/shop.js"></script>
    <script src="js/pages/orders.js"></script>

    <script src="js/app.js"></script>

</body>
</html>
